<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>its suspicious</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="card" role="main">
    <div class="emoji" aria-hidden="true">💘</div>
    <h1 id="question">Alina, will you be my Valentine???? 💘💘💘</h1>

    <div class="btn-row" id="btnRow">
      <button id="yesBtn" class="btn yes">Yes</button>
      <button id="noBtn" class="btn no">No</button>
    </div>
  </main>

  <div id="success" class="success hidden" aria-hidden="true">
    <div class="success-card">
      <h2>Smart decision))) 💞</h2>
      <p>Ohhhhhhh</p>
      <button id="resetBtn" class="btn">Rejouer</button>
    </div>
  </div>

  <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

  <!-- defer = le JS attend que le HTML soit prêt -->
  <script src="script.js?v=2" defer></script>
</body>
</html>
